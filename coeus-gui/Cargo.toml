[package]
name = "coeus-gui"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "coeus-gui"
path = "src/main.rs"

[dependencies]
coeus = { path = "../coeus" }
eframe = { version = "0.31", features = ["wgpu"] }
rfd = "0.15"
regex = "1.11.1"
serde_json = "1.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
typst = { git = "https://github.com/typst/typst.git", tag = "v0.14.2", package = "typst" }
typst-assets = { version = "0.14.0", features = ["fonts"] }
typst-pdf = { git = "https://github.com/typst/typst.git", tag = "v0.14.2", package = "typst-pdf" }
typst-render = { git = "https://github.com/typst/typst.git", tag = "v0.14.2", package = "typst-render" }
typst-ide = { git = "https://github.com/typst/typst.git", tag = "v0.14.2", package = "typst-ide" }
time = "0.3"
ux = "0.1.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
